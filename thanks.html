<style>
/* =========================================================
   EASY PASS — style.css
   Brand: navy + gold, taken from the split mask logo
   ========================================================= */
:root {
  --navy: #14265e;
  --navy-deep: #0d1a45;
  --blue: #2447a8;
  --gold: #d4a72c;
  --gold-soft: #f1dc9c;
  --gold-deep: #9a7412;
  --paper: #f3f5fa;
  --card: #ffffff;
  --ink: #0e1a3d;
  --muted: #55607e;
  --line: #d8deec;
  --ok: #1f8a4c;
  --err: #b3261e;
  --radius-lg: 22px;
  --radius-sm: 10px;
  --maxw: 1160px;
  --head: "Outfit", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1330;
    --card: #131e45;
    --ink: #eef1fa;
    --muted: #a9b3d1;
    --line: #26336a;
    --navy: #1b3278;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1330;
  --card: #131e45;
  --ink: #eef1fa;
  --muted: #a9b3d1;
  --line: #26336a;
  --navy: #1b3278;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-behavior: smooth; scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--head); line-height: 1.15; margin: 0 0 .5em; }
h2 { font-size: clamp(1.9rem, 4vw, 2.75rem); font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.wrap { width: min(var(--maxw), 100% - 2.5rem); margin-inline: auto; }
.section { padding: clamp(4rem, 8vw, 6.5rem) 0; }
.section-intro { max-width: 60ch; color: var(--muted); margin-bottom: 2.5rem; }
.skip { position: absolute; left: -999px; top: 0; background: var(--gold); color: var(--navy-deep); padding: .6rem 1rem; z-index: 100; }
.skip:focus { left: 1rem; top: 1rem; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .55rem;
  font-family: var(--head); font-weight: 600; font-size: 1rem;
  padding: .85rem 1.5rem; border-radius: 999px; border: 2px solid transparent;
  text-decoration: none; cursor: pointer; transition: transform .15s, background .15s, color .15s;
}
.btn:hover { transform: translateY(-2px); }
.btn-gold { background: var(--gold); color: var(--navy-deep); }
.btn-gold:hover { background: #e2b843; }
.btn-navy { background: var(--navy); color: #fff; }
.btn-outline { border-color: currentColor; background: transparent; }
.btn-wa { background: #25d366; color: #06371b; }
.btn svg { width: 20px; height: 20px; flex: none; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--navy-deep) 92%, transparent);
  backdrop-filter: blur(10px);
  color: #fff;
}
.nav { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; font-family: var(--head); font-weight: 800; font-size: 1.35rem; }
.brand img { width: 44px; height: 44px; object-fit: contain; }
.brand .b-gold { color: var(--gold); }
.nav-links { display: flex; gap: 1.6rem; list-style: none; margin: 0; padding: 0; align-items: center; }
.nav-links a { text-decoration: none; font-weight: 600; font-size: .98rem; opacity: .88; }
.nav-links a:hover { opacity: 1; color: var(--gold-soft); }
.nav-links .btn { opacity: 1; padding: .6rem 1.15rem; }
.nav-toggle { display: none; background: none; border: 0; color: #fff; cursor: pointer; padding: .4rem; }
.nav-toggle svg { width: 28px; height: 28px; }

@media (max-width: 900px) {
  .nav-toggle { display: block; }
  .nav-links {
    position: absolute; left: 0; right: 0; top: 100%;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--navy-deep); padding: .5rem 1.25rem 1.25rem;
    display: none;
  }
  .nav-links.open { display: flex; }
  .nav-links a { display: block; padding: .8rem 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .nav-links .btn { justify-content: center; margin-top: .8rem; border: 0; }
}

/* ---------- Hero: the split mask ---------- */
.hero {
  position: relative;
  background: linear-gradient(90deg, var(--navy) 0 50%, var(--gold) 50% 100%);
  color: #fff;
  overflow: hidden;
  text-align: center;
  padding: clamp(2.5rem, 6vw, 4.5rem) 1rem clamp(3rem, 7vw, 5rem);
}
.hero::before {
  /* subtle paper grain on both halves */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .08;
  background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px);
  background-size: 5px 5px;
}
.hero-mask { width: clamp(190px, 30vw, 300px); margin: 0 auto 1.2rem; position: relative; filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.hero-word {
  font-family: var(--head); font-weight: 900;
  font-size: clamp(3.4rem, 13vw, 9.5rem); line-height: .9; letter-spacing: -.03em;
  display: grid; grid-template-columns: 1fr 1fr; margin: 0 0 1.2rem;
  position: relative;
}
.hero-word span:first-child { text-align: right; padding-right: .12em; color: #fff; }
.hero-word span:last-child { text-align: left; padding-left: .12em; color: var(--navy-deep); }
.hero-sub { display: grid; grid-template-columns: 1fr 1fr; position: relative; font-family: var(--head); font-weight: 600; font-size: clamp(1rem, 2.4vw, 1.35rem); margin-bottom: 1.8rem; }
.hero-sub span:first-child { text-align: right; padding-right: .7em; }
.hero-sub span:last-child { text-align: left; padding-left: .7em; color: var(--navy-deep); }
.hero-levels { position: relative; display: inline-flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-bottom: 2rem; }
.hero-levels li { list-style: none; background: #fff; color: var(--navy-deep); font-weight: 700; font-size: .92rem; padding: .35rem 1rem; border-radius: 999px; }
.hero-levels { padding: 0; }
.hero-cta { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; }
.hero-cta .btn-light { background: #fff; color: var(--navy-deep); }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .hero-mask { animation: none; } html { scroll-behavior: auto; } .btn:hover { transform: none; } }

/* ---------- Trust strip ---------- */
.strip { background: var(--navy-deep); color: #dfe5f7; font-weight: 600; }
.strip ul { list-style: none; margin: 0; padding: 1rem 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 2.2rem; font-size: .96rem; }
.strip li { display: flex; align-items: center; gap: .45rem; }
.strip li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

/* ---------- Services ---------- */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.svc {
  display: grid; grid-template-columns: 52px 1fr; gap: 1rem; align-items: start;
  padding: 1.6rem 1.2rem 1.6rem 0; border-bottom: 1px solid var(--line);
}
.svc-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-deep); }
.svc-icon svg { width: 28px; height: 28px; }
.svc h3 { margin-bottom: .25rem; }
.svc p { color: var(--muted); margin: 0; font-size: .98rem; }
.svc.featured .svc-icon { background: var(--navy); color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .svc-icon { color: var(--gold); } }

/* ---------- Tech store ---------- */
.tech { background: var(--navy); color: #fff; }
.tech .section-intro { color: #c6cfeb; }
.tech-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 2.5rem; align-items: start; }
.products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.product { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: var(--radius-lg); padding: 1.3rem; display: flex; flex-direction: column; }
.product-art { height: 110px; display: grid; place-items: center; margin-bottom: .9rem; color: var(--gold); }
.product-art svg { height: 100%; width: auto; }
.product h3 { font-size: 1.08rem; margin-bottom: .2rem; }
.product p { color: #c6cfeb; font-size: .93rem; flex: 1; }
.product .btn { align-self: flex-start; padding: .55rem 1rem; font-size: .9rem; }
.tech-services { background: #fff; color: var(--ink); border-radius: var(--radius-lg); padding: 1.8rem; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tech-services { background: var(--card); } }
:root[data-theme="dark"] .tech-services { background: var(--card); }
.tech-services h3 { font-size: 1.35rem; }
.tech-services ul { list-style: none; padding: 0; margin: 0 0 1.4rem; }
.tech-services li { display: flex; justify-content: space-between; gap: 1rem; padding: .8rem 0; border-bottom: 1px dashed var(--line); }
.tech-services li span:last-child { color: var(--muted); font-size: .92rem; text-align: right; }
@media (max-width: 900px) { .tech-layout { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .products { grid-template-columns: 1fr; } }

/* ---------- Process ---------- */
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; counter-reset: s; position: relative; }
.steps li { counter-increment: s; position: relative; padding-top: 4.2rem; }
.steps li::before {
  content: counter(s); position: absolute; top: 0; left: 0;
  width: 3.2rem; height: 3.2rem; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--head); font-weight: 800; font-size: 1.3rem;
  background: linear-gradient(90deg, var(--navy) 50%, var(--gold) 50%); color: #fff;
}
.steps li::after { content: ""; position: absolute; top: 1.6rem; left: 3.8rem; right: -.6rem; height: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps p { color: var(--muted); font-size: .98rem; }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } .steps li::after { display: none; } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }

/* ---------- Why trust us ---------- */
.trust { display: grid; grid-template-columns: 1fr 1.3fr; gap: 3rem; align-items: center; }
.trust-flyer { border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 30px 60px -30px rgba(13,26,69,.55); transform: rotate(-2deg); width: 100%; max-width: min(380px, 100%); height: auto; }
.trust > * { min-width: 0; }
.trust-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem 2rem; margin-top: 1.5rem; }
.trust-list div { border-left: 3px solid var(--gold); padding-left: 1rem; }
.trust-list h3 { margin-bottom: .2rem; }
.trust-list p { color: var(--muted); margin: 0; font-size: .97rem; }
@media (max-width: 860px) { .trust { grid-template-columns: 1fr; } .trust-flyer { margin: 0 auto; } }
@media (max-width: 520px) { .trust-list { grid-template-columns: 1fr; } }

/* ---------- Request form ---------- */
.request { background: linear-gradient(180deg, var(--paper) 0%, color-mix(in srgb, var(--gold) 10%, var(--paper)) 100%); }
.form-shell { background: var(--card); border-radius: var(--radius-lg); box-shadow: 0 24px 60px -34px rgba(13,26,69,.45); overflow: hidden; }
.form-head { background: var(--navy); color: #fff; padding: 1.6rem clamp(1.2rem, 4vw, 2.5rem); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
.form-head h3 { margin: 0; font-size: 1.4rem; }
.form-head p { margin: 0; color: #c6cfeb; font-size: .95rem; }
.ref-pill { background: var(--gold); color: var(--navy-deep); font-family: var(--head); font-weight: 700; padding: .4rem .9rem; border-radius: 999px; font-size: .92rem; }
form.request-form { padding: clamp(1.2rem, 4vw, 2.5rem); }
fieldset { border: 0; padding: 0; margin: 0 0 2.2rem; }
legend { font-family: var(--head); font-weight: 700; font-size: 1.15rem; margin-bottom: 1rem; display: flex; align-items: center; gap: .6rem; }
legend .n { width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--navy-deep); font-size: .95rem; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem 1.2rem; }
.grid .span-2 { grid-column: span 2; }
.grid .span-3 { grid-column: 1 / -1; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } .grid .span-2, .grid .span-3 { grid-column: 1 / -1; } }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
.field label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: .35rem; }
.field label .req { color: var(--err); }
.field input, .field select, .field textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: .75rem .85rem; min-height: 48px;
}
.field textarea { min-height: 130px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
.field .hint { font-size: .84rem; color: var(--muted); margin-top: .3rem; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--err); }
.field .err { display: none; color: var(--err); font-size: .85rem; margin-top: .3rem; }
.field.invalid .err { display: block; }

.drops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 800px) { .drops { grid-template-columns: 1fr; } }
.drop {
  position: relative; border: 2px dashed var(--line); border-radius: var(--radius-sm);
  padding: 1.3rem 1rem; text-align: center; background: var(--paper); transition: border-color .15s, background .15s;
}
.drop.drag { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--paper)); }
.drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.drop svg { width: 34px; height: 34px; color: var(--gold-deep); margin: 0 auto .4rem; }
.drop strong { display: block; font-family: var(--head); }
.drop small { color: var(--muted); }
.file-list { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; gap: .45rem; text-align: left; }
.file-list li { display: flex; align-items: center; gap: .6rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .55rem; font-size: .86rem; position: relative; z-index: 2; }
.file-list img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; }
.file-list .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-list .fsize { color: var(--muted); }

.check { display: flex; gap: .7rem; align-items: flex-start; font-size: .95rem; }
.check input { width: 20px; height: 20px; margin-top: .2rem; accent-color: var(--navy); flex: none; }
.form-actions { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin-top: 1.5rem; }
.form-note { font-size: .88rem; color: var(--muted); margin-top: 1rem; }
.form-status { display: none; margin-top: 1rem; padding: .9rem 1rem; border-radius: var(--radius-sm); font-weight: 600; }
.form-status.show { display: block; }
.form-status.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.form-status.bad { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }

/* ---------- FAQ ---------- */
.faq { max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); padding: 1.1rem 0; }
.faq summary { cursor: pointer; font-family: var(--head); font-weight: 600; font-size: 1.1rem; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--gold-deep); font-size: 1.5rem; line-height: 1; transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { color: var(--muted); margin: .7rem 0 0; }

/* ---------- Contact + footer ---------- */
.contact { background: linear-gradient(90deg, var(--navy) 0 50%, var(--gold) 50% 100%); color: #fff; }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; }
.contact-grid > div { padding: clamp(2.5rem, 6vw, 4rem) clamp(0rem, 3vw, 2.5rem); }
.contact-grid > div:last-child { color: var(--navy-deep); }
.contact a.big { display: block; font-family: var(--head); font-weight: 800; font-size: clamp(1.4rem, 3.4vw, 2.2rem); text-decoration: none; margin: .4rem 0 1rem; word-break: break-word; }
.contact a.big:hover { text-decoration: underline; }
@media (max-width: 760px) {
  .contact { background: var(--navy); }
  .contact-grid { grid-template-columns: 1fr; }
  .contact-grid > div:last-child { background: var(--gold); margin: 0 -1.25rem; padding-inline: 1.25rem; }
}
.site-footer { background: var(--navy-deep); color: #aeb8d8; padding: 2.2rem 0 calc(2.2rem + env(safe-area-inset-bottom, 0px)); font-size: .92rem; }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; }
.site-footer a { color: #fff; }

/* ---------- Floating WhatsApp ---------- */
.wa-float {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  width: 60px; height: 60px; border-radius: 50%; background: #25d366; color: #fff;
  display: grid; place-items: center; box-shadow: 0 10px 25px rgba(0,0,0,.25);
}
.wa-float svg { width: 32px; height: 32px; }

/* Thank-you page */
.thanks { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; background: linear-gradient(90deg, var(--navy) 0 50%, var(--gold) 50% 100%); }
.thanks-card { background: var(--card); color: var(--ink); border-radius: var(--radius-lg); padding: 2.5rem; max-width: 520px; }
.thanks-card img { width: 140px; margin: 0 auto 1rem; }
